name: Build Android APK

# Builds only the Android app in android/. The web dashboard is untouched.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      # One signing key for every build, so new APKs install over old ones.
      # It's created and committed by the first run.
      - name: Create signing key on first run
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey \
              -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add debug.keystore
            git commit -m "Add Android signing key [skip ci]"
            git push
          fi
      - run: gradle :app:assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk obd-auto.apk
      - uses: actions/upload-artifact@v4
        with:
          name: obd-auto-apk
          path: android/obd-auto.apk
      # Keep one "android-latest" release so the phone can always download from the same link.
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest obd-auto.apk --title "OBD Auto Android build (#${{ github.run_number }})" --notes "Built from ${{ github.sha }}" --target ${{ github.sha }}
